<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      const CONFIG_COOKIE_NAME = 'config';
      const cookieMap = {};
      document.cookie.split(';').forEach(pair => {
        const [key, value] = pair.trim().split('=');
        cookieMap[key] = value;
      });
      const configCookie = cookieMap[CONFIG_COOKIE_NAME];
      if (configCookie) {
        try {
          const decoded = atob(configCookie);
          const config = JSON.parse(decoded);
          if (config.ui?.borderless) {
            document.documentElement.classList.add('borderless');
          }
        } catch (e) {
          console.error('Error parsing config cookie:', e);
        }
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
